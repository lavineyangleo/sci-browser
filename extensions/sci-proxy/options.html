<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>sci-proxy</title><link rel="icon" href="assets/icon-32.png"><link rel="stylesheet" href="style-代理界面-v16.css"><link rel="stylesheet" href="ui/options-v18.css"><link rel="stylesheet" href="ui/direct-直连规则-v19.css"></head>
<body><header class="brand"><img src="assets/logo.png" width="46" height="46" alt="sci-proxy"><div><h1>sci-proxy</h1><p>让每一次连接，都在掌握之中。</p></div><span class="protocol">SOCKS5</span></header>
<main><section class="connection" aria-label="代理状态"><div><span class="eyebrow">连接状态</span><div class="status-title"><i id="status-dot" aria-hidden="true"></i><strong id="state">正在连接</strong></div><p id="state-detail">正在读取本地代理服务</p></div><label class="switch"><input type="checkbox" id="enabled" role="switch" aria-label="启用代理" disabled><span class="track" aria-hidden="true"></span></label></section>
<div class="section-heading"><h2>代理节点</h2><span>仅保存后生效</span></div>
<details class="import-panel"><summary>从 SOCKS5 链接导入<span aria-hidden="true">＋</span></summary><div class="import-content"><label class="sr-only" for="url">SOCKS5 链接</label><div class="line"><input id="url" type="password" placeholder="粘贴完整 SOCKS5 链接" autocomplete="off" spellcheck="false"><button id="import" type="button">导入</button></div><p>导入后可继续编辑，保存时应用配置。</p></div></details>
<form id="form"><div class="endpoint"><div class="field"><label for="host">服务器地址</label><input id="host" required placeholder="IP 地址或主机名" autocomplete="off" spellcheck="false"></div><div class="field port"><label for="port">端口</label><input id="port" type="number" min="1" max="65535" required placeholder="端口"></div></div>
<div class="field"><label for="username">用户名 <span>可选</span></label><input id="username" autocomplete="off" spellcheck="false" placeholder="代理认证用户名"></div>
<div class="field"><div class="password-label"><label for="password">密码 <span>可选</span></label><label class="reveal"><input id="reveal" type="checkbox">显示密码</label></div><input id="password" type="password" autocomplete="off" placeholder="代理认证密码"></div>
<div class="actions"><button id="save" type="submit">保存并应用<span aria-hidden="true">↗</span></button><button id="test" type="button">测试出口</button></div></form>
<p id="message" role="status" aria-live="polite"></p><section id="result" hidden aria-label="出口测试结果"><div><span class="eyebrow">出口 IP</span><strong id="ip"></strong></div><span id="latency"></span></section><section id="direct-rules" aria-live="polite"></section></main>
<footer><span><i aria-hidden="true"></i>sci-browser 连接工具</span><span>by LavineLeo</span></footer><script src="ui/options-v18.js"></script><script type="module" src="ui/direct-直连规则-v19.js"></script></body></html>
